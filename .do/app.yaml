name: teneo
region: nyc

services:
  # Backend API server with SQLite database
  - name: server
    github:
      repo: your-github-username/teneo  # Update with your repo
      branch: main
      deploy_on_push: true
    dockerfile_path: server/Dockerfile
    source_dir: server
    instance_count: 1
    instance_size_slug: basic-xxs  # $5/mo - upgrade as needed
    http_port: 4000
    routes:
      - path: /api
      - path: /health
    envs:
      - key: DATABASE_PATH
        value: /app/data/teneo.db
      - key: NODE_ENV
        value: production
      - key: SIMULATION_ENABLED
        value: "true"
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
    # Persistent volume for SQLite database
    volumes:
      - name: teneo-data
        mount_path: /app/data
        size_gi: 1

  # Frontend static site
  - name: frontend
    github:
      repo: your-github-username/teneo  # Update with your repo
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 4444
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      # Empty string = same domain, relative /api paths work
      - key: VITE_API_URL
        value: ""
      - key: VITE_WS_URL
        value: ""
