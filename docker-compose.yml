services:
  # Backend (Node.js + Express + WebSocket + Simulation)
  server:
    build: ./server
    ports:
      - "4000:4000"
    volumes:
      - teneo-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/teneo.db
      - SIMULATION_ENABLED=true
      - PORT=4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Vite + React)
  frontend:
    build: .
    ports:
      - "4444:4444"
    environment:
      - VITE_API_URL=http://localhost:4000
      - VITE_WS_URL=ws://localhost:4000
    depends_on:
      - server

volumes:
  teneo-data:
    driver: local
